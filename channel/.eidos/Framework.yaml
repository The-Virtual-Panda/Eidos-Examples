# The framework document: the structure this project is written in. See EIDOS.md for what each key means;
# the `eidos` CLI edits this file. Every path is relative to this folder.

eidos_version: 5.14.0

# kebab-case | TitleCase | Title Case. Settled at install; changing it later means renaming files.
naming: kebab-case

# Every file at the top of the project, one entry each.
top_level:
  - title: README
    path: ../README.md
    description: "where to start: what this is, and where things are"
  - title: Content Calendar
    path: ../content-calendar.md
    description: what ships when, on one page
  - title: Brand Kit
    path: ../brand-kit.md
    description: "the look and the sound: colors, fonts, intro, outro, lower thirds"
  - title: Rate Card
    path: ../rate-card.md
    description: what a placement costs, and what a sponsor gets

# Every folder at the top of the project, one entry each. `owned_by` names what governs it: "@eidos/collections" for
# blueprints, "@<tool>/<kind>" for a tool's own folder. Absent, the folder is yours and nothing reads it.
folders:
  # The framing docs: what every other blueprint is judged against. One left unwritten is a gap to surface,
  # not a failure.
  - name: the-channel
    title: The Channel
    owned_by: "@eidos/collections"
    description: "The channel itself, four pages: who watches, what the formats are, how it sounds, and how it makes money. Every video, post, and page gets checked against these."
    variants:
      - { name: audience, template: templates/frame.audience.md, description: "who watches, what they come for, and how each kind is different", default: true }
      - { name: format, template: templates/frame.format.md, description: "the formats, the title and thumbnail rules, the schedule, the platforms" }
      - { name: voice, template: templates/frame.voice.md, description: "who the viewer meets on camera, how it sounds, and what the channel never does" }
      - { name: market, template: templates/frame.market.md, description: "the niche, the channels next to it, and how it makes money" }
  - name: videos
    title: Videos
    owned_by: "@eidos/collections"
    description: "One page per video, Short, stream, or episode, grouped by series, and a series by season where it runs in seasons."
    variants:
      - { name: full, template: templates/video.full.md, description: "the full page for a video: the video template", default: true }
      - { name: short, template: templates/video.short.md, description: "a Short or a clip: one hook, one beat, vertical" }
      - { name: pitch, template: templates/video.pitch.md, description: "an idea: what it does, the hook, what you would need; grow into full" }
      - { name: stream, template: templates/video.stream.md, description: "a live stream: the run of show, the segments, what is planned and what is left to chat, and what gets clipped" }
      - { name: episode, template: templates/video.episode.md, description: "a podcast or interview episode: the guest, why them, the questions, the segments, and the show notes" }
    label: Series
    folder_property: series
    folders: [] # one entry per series, a name and a description, as they accrue; a series that runs in seasons holds a folder per season
  - name: posts
    title: Posts
    owned_by: "@eidos/collections"
    description: "The written side: one page per post or newsletter issue, grouped by the same series as the videos."
    variants:
      - { name: full, template: templates/post.full.md, description: "the full page for a post", default: true }
      - { name: companion, template: templates/post.companion.md, description: "the written twin of a video: what it adds, and the video it goes with" }
      - { name: newsletter, template: templates/post.newsletter.md, description: "a newsletter issue: the lead, the links, and the one thing it asks the reader to do" }
    label: Series
    folder_property: series
    folders: [] # the same series, and seasons, as the videos, as they accrue
  - name: pages
    title: Pages
    owned_by: "@eidos/collections"
    description: "The site: one page each, flat. About, sponsors, merch, the newsletter; the part of the channel that is not on a platform."
    variants:
      - { name: page, template: templates/page.page.md, description: "a page on the site: what it is for, and what a visitor does there", default: true }
  - name: files
    title: Files
    owned_by: "@assets/files"
    description: "Thumbnails, scripts, b-roll lists, sponsor decks, and the brand kit, kept by the Assets plugin: each file linked to the videos, posts, and pages it belongs to."
  - name: production
    title: Production
    owned_by: "@backlog/tasks"
    description: "The production pipeline: one task per piece of work that gets a video, post, or page live (a production, a thumbnail, a booking, a fact check, a sponsor deliverable), on a board from Up Next to Live. The Backlog plugin's."
  - name: sponsorships
    title: Sponsorships
    owned_by: "@records/sponsorships"
    description: "The brand deals: one record per sponsorship (the brand, the placement, the rate, the usage, the exclusivity), Offered or In Talks until the creator books or declines it, and listed on the videos that carry it. The Records plugin's."

# The property contract, one block per owner. A property applies to `all` collections or a list; a required
# one is generated into every new blueprint and surfaced when missing; `options` closes the value to a set.
properties:
  # The standard's. migrate rewrites this block; don't hand-edit it.
  core:
    - { name: id, type: Text, required: true, meaning: "Stable, unique identity, in any form. Assigned once, never changed." }
    - { name: title, type: Text, required: true, meaning: Human-readable name. }
    - { name: summary, type: Text, meaning: "One line: what this blueprint is. Feeds the index; absent, the index flags it." }
    - { name: variant, type: Text, meaning: "Which variant this blueprint follows. Absent = the nearest default on its folder's path, else the collection's; `none` = no template." }
  # Yours. The seed ships defaults; keep, scope, or drop any of them.
  custom:
    - name: status
      type: Text
      applies_to:
        - videos
        - posts
        - pages
      options: [ Idea, Greenlit, In Production, Scheduled, Published, Shelved ]
      meaning: "Where this stands: Idea (pitched, not committed), Greenlit (it will be made), In Production (its work is on the board in Production), Scheduled (finished, with a date), Published (live), or Shelved (not made, or taken down, the reason kept in Notes and Decisions)."
      canvas:
        show: true
        styles:
          Idea:
            color: "#8b9099"
          Greenlit:
            color: "#d3a53c"
          In Production:
            color: "#5f80cf"
          Scheduled:
            color: "#4aa39f"
          Published:
            color: "#7fae6c"
          Shelved:
            color: "#cf7b8f"
    - { name: date_created, type: Date, applies_to: all, meaning: "YYYY-MM-DD. Set once.", eidosmd: { new: today } }
    - { name: date_modified, type: Date, applies_to: all, meaning: "YYYY-MM-DD. The last change.", eidosmd: { new: today } }
    - { name: tags, type: List, applies_to: all, meaning: "Free tags." }
    - { name: series, type: Text, applies_to: [ videos, posts ], meaning: "Which series this belongs to. Its folder's path, such as a/b; a value that is not its folder warns." }
    - { name: watch_first, type: List, applies_to: [ videos, posts ], meaning: "Videos or posts a viewer should see before this one, as links." }
    - { name: publish_date, type: Date, applies_to: [ videos, posts ], meaning: "When it went live, or goes live." }
    - { name: runtime, type: Number, applies_to: [ videos ], meaning: "How long it runs, in minutes." }
    - { name: format, type: Text, applies_to: [ videos ], meaning: "The format it follows, named as the Formats page names it. A video that fits none is a new format or a mistake." }
    - { name: guests, type: List, applies_to: [ videos, posts ], meaning: "Who appears besides the host: a guest, a co-host, a collaborator, by name." }

# The project's own terms: term, means, not (the near-misses and why), and see (the blueprint that defines it).
# Starts empty; Eidos declares none.
vocabulary:
  - term: format
    means: A recurring shape a video takes, with its own beats and runtime, declared on the Formats page.
    not:
      - "genre: a genre is the kind of content a niche holds; a format is how one video in it is built"
    see: ../the-channel/formats.md
  - term: series
    means: A run of videos and posts under one name, a folder of Videos and of Posts, holding a folder per season where it runs in seasons.
    not:
      - "playlist: a playlist is the platform's list, and may mix series or hold only part of one"
  - term: read
    means: The sponsor's segment inside a video, episode, or stream, written on its page under Sponsor and End Screen.
    not:
      - "plug: a plug is a mention the channel gives for nothing; a read is paid for, under a sponsorship"
  - term: sponsorship
    means: "One deal with a brand: the placement, the rate, the usage, and the exclusivity, a record in Sponsorships that the videos carrying it list."
    not:
      - "brand deal: the same thing, called a sponsorship here so one word finds every one"

# Generated by `eidos index`; never hand-edited. One list per collection, in the order the markdown index would use.
index:
  the-channel:
    - id: audience
      title: Audience
      summary: null
      path: audience.md
    - id: formats
      title: Formats
      summary: null
      path: formats.md
    - id: niche-and-money
      title: Niche and Money
      summary: null
      path: niche-and-money.md
    - id: voice
      title: Voice
      summary: null
      path: voice.md
  videos: []
  posts: []
  pages: []
