# The framework document: the structure this root is written in. See EIDOS.md for what each key means;
# the `eidos` CLI edits this file. Every path is relative to this folder.

eidos_version: 5.4.0

# kebab-case | TitleCase | Title Case. Settled at install; changing it later means renaming files.
naming: Title Case

# Every file at the root, one entry each.
top_level:
  - title: README
    path: ../README.md
    description: "the root's front door: what this is, and pointers in."
  - title: Schedule
    path: ../Schedule.md
    description: the whole project on one page, phase by phase, with dates
  - title: Contacts
    path: ../Contacts.md
    description: everyone on the job, on one page
  - title: Change Log
    path: ../Change Log.md
    description: every change to the scope after the quote, dated, with what it cost

# Every folder at the root, one entry each. `owned_by` names what governs it: "@eidos/collections" for
# blueprints, "@<tool>/<kind>" for a tool's own folder. Absent, the folder is yours and nothing reads it.
folders:
  # The framing docs: what every other blueprint is judged against. One left unwritten is a gap to surface,
  # not a failure.
  - name: The Brief
    owned_by: "@eidos/collections"
    description: "The big picture, four pages: what you want, the house as it stands, what it can cost, and what the permits require. Every room, job, and pick gets checked against these."
    variants:
      - { name: wants, template: templates/frame.wants.md, description: "what you want and why, and what this project is not", default: true }
      - { name: house, template: templates/frame.house.md, description: "the house as it stands: what is there, what stays, what the work has to live with" }
      - { name: budget, template: templates/frame.budget.md, description: "the money, the dates, what matters most, and the hard limits" }
      - { name: permits, template: templates/frame.permits.md, description: "permits, inspections, and the rules the work has to meet" }
  - name: Rooms
    owned_by: "@eidos/collections"
    description: "One page per room the project touches, grouped by floor: what the finished room has to do."
    variants:
      - { name: full, template: templates/room.full.md, description: "the full page for a room", default: true }
      - { name: rough, template: templates/room.rough.md, description: "a rough version: what it is for, what is still to decide, what it has to do; grow into full" }
    grouping:
      label: Floors
      property: floor
      groups: [] # one entry per floor (basement, main, upstairs, outside), a name and a description, as they accrue
  - name: The Work
    owned_by: "@eidos/collections"
    description: "One page per job, grouped by phase: what gets done, in what order, and what each job waits on."
    variants:
      - { name: full, template: templates/job.full.md, description: "the full page for a job", default: true }
      - { name: rough, template: templates/job.rough.md, description: "a rough version: what it is, what is still to decide, what gets done; grow into full" }
    grouping:
      label: Phases
      property: phase
      groups: [] # one entry per phase in the order the work runs (demolition, rough-in, finishes), a name and a description, as they accrue
  - name: Selections
    owned_by: "@eidos/collections"
    description: "One page per fixture, finish, or material, grouped by room: what it has to be, and what you chose."
    variants:
      - { name: full, template: templates/selection.full.md, description: "a pick you have made: what it had to be, and what you chose", default: true }
      - { name: option, template: templates/selection.option.md, description: "a pick you are still weighing; grow into full when you choose it" }
    grouping:
      label: Rooms
      property: room
      groups: [] # one entry per room that takes selections, a name and a description, as they accrue
  - name: Files
    description: "Drawings, permits, quotes, spec sheets, and site photos the pages link to."

# The property contract, one block per owner. A property applies to `all` collections or a list; a required
# one is generated into every new blueprint and surfaced when missing; `options` closes the value to a set.
properties:
  # The standard's. migrate rewrites this block; don't hand-edit it.
  core:
    - { name: id, type: Text, required: true, meaning: "Stable, unique identity, in any form. Assigned once, never changed." }
    - { name: title, type: Text, required: true, meaning: Human-readable name. }
    - { name: summary, type: Text, meaning: "One line: what this blueprint is. Feeds the index; absent, the index flags it." }
    - { name: variant, type: Text, meaning: Which variant this blueprint follows. Absent = the collection's default. }
  # Yours. The seed ships defaults; keep, scope, or drop any of them. Only the grouping is required.
  custom:
    - name: status
      type: Text
      applies_to: all
      options: [ Idea, Planned, Approved, In Progress, Done, Cut ]
      meaning: "Where this stands: Idea, Planned, Approved, In Progress, Done, or Cut."
      eidosmd:
        canvas:
          show: true
          styles:
            Draft:
              color: "#8b9099"
            Intake:
              color: "#d3a53c"
            In Progress:
              color: "#5f80cf"
            Done:
              color: "#7fae6c"
            Archived:
              color: "#8b9099"
            Deprecated:
              color: "#cf7b8f"
            needs-clarification:
              color: "#5f80cf"
            maybe:
              color: "#e08a63"
            visionary:
              color: "#4aa39f"
    - { name: date_created, type: Date, applies_to: all, meaning: "YYYY-MM-DD. Set once." }
    - { name: date_modified, type: Date, applies_to: all, meaning: "YYYY-MM-DD. The last change." }
    - { name: tags, type: List, applies_to: all, meaning: "Free tags." }
    - { name: floor, type: Text, required: true, applies_to: [ Rooms ], meaning: "Which floor the room is on (basement, main, upstairs, outside). Matches its sub-folder." }
    - { name: needs, type: List, applies_to: [ Rooms, The Work, Selections ], meaning: "Rooms, jobs, or picks that have to be done or decided first, as links." }
    - { name: phase, type: Text, applies_to: [ The Work ], required: true, meaning: "Which phase the job runs in (demolition, rough-in, finishes). Matches its sub-folder." }
    - { name: room, type: Text, applies_to: [ Selections ], required: true, meaning: "Which room this goes in. Matches its sub-folder." }
    - { name: trade, type: Text, applies_to: [ The Work ], meaning: "Who does the work: electrical, plumbing, framing, finishes." }
    - { name: cost, type: Number, applies_to: [ The Work, Selections ], meaning: "What it is estimated or quoted at." }

# The root's own terms: term, means, not (the near-misses and why), and see (the blueprint that defines it).
# Starts empty; Eidos declares none.
vocabulary: []

# Generated by `eidos index`; never hand-edited. One list per collection, in the order the markdown index would use.
index:
  The Brief:
    - id: budget
      title: Budget
      summary: null
      path: Budget.md
    - id: permits
      title: Permits
      summary: null
      path: Permits.md
    - id: the-house
      title: The House
      summary: null
      path: The House.md
    - id: what-we-want
      title: What We Want
      summary: null
      path: What We Want.md
  Rooms: []
  The Work: []
  Selections: []
