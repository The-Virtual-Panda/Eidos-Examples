# The framework document: the structure this project is written in. See EIDOS.md for what each key means;
# the `eidos` CLI edits this file. Every path is relative to this folder.

eidos_version: 5.14.0

# kebab-case | TitleCase | Title Case. Settled at install; changing it later means renaming files.
naming: kebab-case

# Every file at the top of the project, one entry each.
top_level:
  - title: Start Here
    path: ../start-here.md
    description: "where to start: what this is, and where things are"
  - title: The One-Pager
    path: ../the-one-pager.md
    description: "the whole game on one page: for a publisher, a festival, or a new teammate"
  - title: Cut List
    path: ../cut-list.md
    description: everything cut from the game, and why
  - title: Playtest Log
    path: ../playtest-log.md
    description: "every playtest, dated: the build, who played, what you saw, what changed"
  - title: Art Bible
    path: ../art-bible.md
    description: "how the game looks and sounds: palette, silhouettes, interface, audio"

# Every folder at the top of the project, one entry each. `owned_by` names what governs it: "@eidos/collections" for
# blueprints, "@<tool>/<kind>" for a tool's own folder. Absent, the folder is yours and nothing reads it.
folders:
  # The framing docs: what every other blueprint is judged against. One left unwritten is a gap to surface,
  # not a failure.
  - name: the-game
    title: The Game
    owned_by: "@eidos/collections"
    description: "The game itself, five pages: its pillars and core loop, who plays it, where it runs, how much game the team can finish, and where it sits in the market. Every mechanic, level, character, and item gets checked against these."
    variants:
      - { name: pillars, template: templates/frame.pillars.md, description: "the game in a breath, its pillars, the core loop, and what it is not", default: true }
      - { name: player, template: templates/frame.player.md, description: "who plays it, what they have played, what they expect, and what they will not forgive" }
      - { name: platform, template: templates/frame.platform.md, description: "where it runs, the controls and accessibility, the budget the build holds, and what stores require" }
      - { name: scope, template: templates/frame.scope.md, description: "the team and the time, the size of the game, the milestones, and the cut line" }
      - { name: market, template: templates/frame.market.md, description: "the games next to it, the hook, the price, and how players find it" }
  - name: mechanics
    title: Mechanics
    owned_by: "@eidos/collections"
    description: "One page per mechanic, in folders by system, and a system's folder can hold smaller systems (Combat, then Melee and Ranged inside it), with the system's own page beside them: why each mechanic is in the game, the pillar it serves, how it plays, its rules and numbers, and what it is not."
    variants:
      - { name: one-pager, template: templates/mechanic.one-pager.md, description: "a mechanic on one page: why it is in the game, how it plays, the rules and numbers so far, what it is not; grow into full", default: true }
      - { name: full, template: templates/mechanic.full.md, description: "the full page for a mechanic with more rules and numbers than a page holds" }
      - { name: system, template: templates/mechanic.system.md, description: "a system's overview, beside the mechanics in its folder: what the system is for, the mechanics in it, how they feed each other, and the numbers that tie them" }
    label: Systems
    folder_property: system
    folders: [] # one entry per system (movement, combat, economy, progression), a name and a description, as they accrue
  - name: levels
    title: Levels
    owned_by: "@eidos/collections"
    description: "One page per level, in a folder per act. A level that grows fights, puzzles, and set pieces becomes a folder of its own, its page beside an encounter page for each: what each level is for, what it teaches, the flow, and what the player leaves with."
    variants:
      - { name: one-pager, template: templates/level.one-pager.md, description: "a level on one page: why it is in the game, what it teaches, the flow, what it is not; grow into full", default: true }
      - { name: full, template: templates/level.full.md, description: "the full page for a level: the flow, the layout, what the player leaves with, and its ties" }
      - { name: encounter, template: templates/level.encounter.md, description: "one fight, puzzle, chase, or set piece inside a level, kept in the level's folder beside the level's page: what it tests, the setup, how it plays, and the way out" }
    label: Acts
    folder_property: act
    folders: [] # one entry per act, world, or chapter, a name and a description, as they accrue
  - name: characters
    title: Characters
    owned_by: "@eidos/collections"
    description: "One page per character the player meets, plays, or fights: why they exist, how they read on screen, and what they do. The cast sits at the top; enemies, and the bosses inside them, start on the enemy page."
    variants:
      - { name: one-pager, template: templates/character.one-pager.md, description: "a character on one page: why they exist, who they are, how they read on screen, what they are not; grow into full", default: true }
      - { name: full, template: templates/character.full.md, description: "the full page for a character with a part in the game" }
      - { name: enemy, template: templates/character.enemy.md, description: "an enemy or a boss: what it tests, how it plays, its tells and numbers" }
    folders:
      - name: enemies
        title: Enemies
        description: "Everything the player fights, on the enemy page: what it tests, its tells, and its numbers. The rest of the cast sits beside this folder."
        default_variant: enemy
        folders:
          - name: bosses
            title: Bosses
            description: "The bosses: an enemy page each, with its phases numbered under How It Plays. Each one is a test of what its act taught."
    label: Rosters
  - name: items
    title: Items
    owned_by: "@eidos/collections"
    description: "One page per item, upgrade, or collectible, grouped by the same systems as the mechanics: how the player gets it and what it does."
    variants:
      - { name: one-pager, template: templates/item.one-pager.md, description: "an item on one page: why it is in the game, how the player gets it, its rules and numbers, what it is not", default: true }
    label: Systems
    folder_property: system
    folders: [] # the same systems as the mechanics, as they accrue
  - name: files
    title: Files
    owned_by: "@assets/files"
    description: "Concept art, blockouts, maps, balance sheets, and the pitch deck the pages link to; a folder inside it is a bundle, one asset of many files, such as a playable prototype build or the art bible's reference sheets. Kept by the Assets plugin."
  - name: backlog
    title: Backlog
    owned_by: "@backlog/tasks"
    description: "The work that builds the game, one task each, kept by the Backlog plugin: tasks, and bugs from playtests, each serving the pages it builds or breaks."
  - name: decisions
    title: Decisions
    owned_by: "@records/decision"
    description: "One record per call that shaped the game, kept by the Records plugin: a design rule, a tuned number, a cut, a technical trade-off. Proposed, then confirmed by the designer, and listed on every page it serves."

# The property contract, one block per owner. A property applies to `all` collections or a list; a required
# one is generated into every new blueprint and surfaced when missing; `options` closes the value to a set.
properties:
  # The standard's. migrate rewrites this block; don't hand-edit it.
  core:
    - { name: id, type: Text, required: true, meaning: "Stable, unique identity, in any form. Assigned once, never changed." }
    - { name: title, type: Text, required: true, meaning: Human-readable name. }
    - { name: summary, type: Text, meaning: "One line: what this blueprint is. Feeds the index; absent, the index flags it." }
    - { name: variant, type: Text, meaning: "Which variant this blueprint follows. Absent = the nearest default on its folder's path, else the collection's; `none` = no template." }
  # Yours. The seed ships defaults; keep, scope, or drop any of them.
  custom:
    - name: status
      type: Text
      applies_to: all
      options: [ Idea, Designed, Prototyped, In Build, Shipped, Cut ]
      meaning: "Where this stands in the game: Idea, Designed (written up), Prototyped (played in a prototype), In Build (in the game), Shipped (in a released build), or Cut (out, with its reason kept in cut_reason)."
      canvas:
        show: true
        styles:
          Idea:
            color: "#8b9099"
          Designed:
            color: "#d3a53c"
          Prototyped:
            color: "#e08a63"
          In Build:
            color: "#5f80cf"
          Shipped:
            color: "#7fae6c"
          Cut:
            color: "#cf7b8f"
    - { name: date_created, type: Date, applies_to: all, meaning: "YYYY-MM-DD. Set once." }
    - { name: date_modified, type: Date, applies_to: all, meaning: "YYYY-MM-DD. The last change." }
    - { name: tags, type: List, applies_to: all, meaning: "Free tags." }
    - { name: system, type: Text, applies_to: [ mechanics, items ], meaning: "Which system this belongs to (movement, combat, economy). Its folder's path, such as a/b; a value that is not its folder warns." }
    - { name: act, type: Text, applies_to: [ levels ], meaning: "Which act, world, or chapter the level sits in. Its folder's path, such as a/b; a value that is not its folder warns." }
    - { name: pillar, type: List, applies_to: [ mechanics, levels, characters, items ], meaning: "The pillars this serves, named as the Pillars page names them. A page that serves none is the first to question when scope gets tight." }
    - { name: needs, type: List, applies_to: [ mechanics, levels, characters, items ], meaning: "Pages that have to be in the build before this one works, as links: the mechanic a level teaches, the ability an item upgrades." }
    - { name: cut_reason, type: Text, applies_to: [ mechanics, levels, characters, items ], meaning: "Why it was cut, in one line, once status is Cut. The page stays, so the reason does." }

# The project's own terms: term, means, not (the near-misses and why), and see (the blueprint that defines it).
# Starts empty; Eidos declares none.
vocabulary:
  - term: Pillar
    means: One of the three or four rules the whole game keeps, as the Pillars page names it; every mechanic, level, character, and item names the pillars it serves.
    not:
      - "goal: a goal is something to reach, a pillar is something every decision answers to"
    see: ../the-game/pillars.md
  - term: System
    means: A group of mechanics that work together toward one job (movement, combat, the economy), kept as a folder in Mechanics with its own page beside its mechanics; a system can hold smaller ones.
    not:
      - "category: the folder is a system because its mechanics feed each other, not because they look alike"
  - term: Encounter
    means: One fight, puzzle, chase, or set piece inside a level, with a page of its own in the level's folder once the level has more than one.
    not:
      - "room: a room is space, an encounter is what the space asks of the player"
  - term: Build
    means: A playable version of the game, named or numbered, as the Playtest Log and every bug name it.
    not:
      - "release: a release is the build that went out to players; name the build it was"
  - term: Cut
    means: "Out of the game on purpose: the page stays, marked Cut, with its cut_reason, so the reason survives."
    not:
      - "deleted: nothing cut is deleted; a deleted page loses the reason it was cut"
      - "postponed: a page waiting for a later milestone is still in, at Idea or Designed"

# Generated by `eidos index`; never hand-edited. One list per collection, in the order the markdown index would use.
index:
  the-game:
    - id: market
      title: Market
      summary: null
      path: market.md
    - id: pillars
      title: Pillars
      summary: null
      path: pillars.md
    - id: platform
      title: Platform
      summary: null
      path: platform.md
    - id: player
      title: Player
      summary: null
      path: player.md
    - id: scope
      title: Scope
      summary: null
      path: scope.md
  mechanics: []
  levels: []
  characters: []
  items: []
