<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="system-ui, sans-serif" font-size="14">
  <title>How the pieces of a course fit</title>
  <rect width="640" height="300" fill="#ffffff"/>
  <g fill="none" stroke="#5f80cf" stroke-width="2">
    <rect x="20" y="30" width="140" height="56" rx="8"/>
    <rect x="250" y="30" width="140" height="56" rx="8"/>
    <rect x="480" y="30" width="140" height="56" rx="8"/>
    <rect x="250" y="130" width="140" height="56" rx="8"/>
    <rect x="250" y="226" width="140" height="56" rx="8"/>
    <rect x="480" y="226" width="140" height="56" rx="8"/>
  </g>
  <g fill="#1f2937" text-anchor="middle">
    <text x="90" y="56">Track</text><text x="90" y="74" font-size="11" fill="#6b7280">groups by subject</text>
    <text x="320" y="56">Course</text><text x="320" y="74" font-size="11" fill="#6b7280">promises LO1, LO2, …</text>
    <text x="550" y="56">Path</text><text x="550" y="74" font-size="11" fill="#6b7280">courses in order</text>
    <text x="320" y="156">Module</text><text x="320" y="174" font-size="11" fill="#6b7280">serves outcomes</text>
    <text x="320" y="252">Lesson</text><text x="320" y="270" font-size="11" fill="#6b7280">serves outcomes</text>
    <text x="550" y="252">Quiz or deck</text><text x="550" y="270" font-size="11" fill="#6b7280">draws on the lesson</text>
  </g>
  <g stroke="#8b9099" stroke-width="1.5">
    <line x1="160" y1="58" x2="250" y2="58"/>
    <line x1="480" y1="58" x2="390" y2="58"/>
    <line x1="320" y1="86" x2="320" y2="130"/>
    <line x1="320" y1="186" x2="320" y2="226"/>
    <line x1="390" y1="254" x2="480" y2="254"/>
  </g>
</svg>
