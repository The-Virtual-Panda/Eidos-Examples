      title: How We Teach
      summary: null
      path: how-we-teach.md
    - id: market
      title: Market
      summary: null
      path: market.md
    - id: mission
      title: Mission
      summary: null
      path: mission.md
    - id: production
      title: Production
      summary: null
      path: production.md
  learners: []
  courses:
    - id: B-S53
      title: How a Course Is Built
      summary: Tracks, courses, modules, lessons, and the learning outcomes that tie them together.
      path: orientation/welcome-to-the-school/how-a-course-is-built.md
      folder: orientation/welcome-to-the-school
    - id: B-G46
      title: Proving What You Learned
      summary: Quizzes, practice and official attempts, flashcard decks, and how written answers are graded.
      path: orientation/welcome-to-the-school/proving-what-you-learned.md
      folder: orientation/welcome-to-the-school
    - id: B-B89
      title: Welcome to the School
      summary: "The course every learner takes first: how a course here is built, and how a learner proves what they learned."
      path: orientation/welcome-to-the-school/welcome-to-the-school.md
      folder: orientation/welcome-to-the-school
  paths: []
