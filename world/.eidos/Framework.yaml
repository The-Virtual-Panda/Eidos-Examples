# The framework document: the structure this root is written in. See EIDOS.md for what each key means;
# the `eidos` CLI edits this file. Every path is relative to this folder.

eidos_version: 5.4.0

# kebab-case | TitleCase | Title Case. Settled at install; changing it later means renaming files.
naming: Title Case

# Every file at the root, one entry each.
top_level:
  - title: README
    path: ../README.md
    description: "the root's front door: what this is, and pointers in."
  - title: History
    path: ../History.md
    description: the world's past in order, on one page
  - title: Player's Guide
    path: ../Player's Guide.md
    description: "what every player may read: the handout"
  - title: Names
    path: ../Names.md
    description: how people and places are named, and how to say them

# Every folder at the root, one entry each. `owned_by` names what governs it: "@eidos/collections" for
# blueprints, "@<tool>/<kind>" for a tool's own folder. Absent, the folder is yours and nothing reads it.
folders:
  # The framing docs: what every other blueprint is judged against. One left unwritten is a gap to surface,
  # not a failure.
  - name: The World
    owned_by: "@eidos/collections"
    description: "The setting itself, four pages: what it is about, how it feels, how it works, and who plays in it. Every place, faction, character, and arc gets checked against these."
    variants:
      - { name: premise, template: templates/frame.premise.md, description: "what the world is about, and what it is not", default: true }
      - { name: tone, template: templates/frame.tone.md, description: "how it feels, and the lines the table and the prose keep" }
      - { name: laws, template: templates/frame.laws.md, description: "how the world works, and what can never happen" }
      - { name: table, template: templates/frame.table.md, description: "who plays, how sessions run, and what the players know" }
  - name: Places
    owned_by: "@eidos/collections"
    description: "One page per place, grouped by region."
    variants:
      - { name: full, template: templates/place.full.md, description: "the full page for a place", default: true }
      - { name: sketch, template: templates/place.sketch.md, description: "a sketch: why it exists, what is still to decide, what is true; grow into full" }
    grouping:
      label: Regions
      property: region
      groups: [] # one entry per region, a name and a description, as they accrue
  - name: Factions
    owned_by: "@eidos/collections"
    description: "One page per power in the world: what it wants, what it holds, what it does next."
    variants:
      - { name: full, template: templates/faction.full.md, description: "the full page for a faction", default: true }
      - { name: sketch, template: templates/faction.sketch.md, description: "a sketch: why it exists, what is still to decide, what is true; grow into full" }
  - name: Characters
    owned_by: "@eidos/collections"
    description: "One page per person the party may meet."
    variants:
      - { name: full, template: templates/character.full.md, description: "the full page for a character", default: true }
      - { name: sketch, template: templates/character.sketch.md, description: "a sketch: why they exist, what is still to decide, what is true; grow into full" }
  - name: Arcs
    owned_by: "@eidos/collections"
    description: "One page per story arc, grouped by campaign."
    variants:
      - { name: full, template: templates/arc.full.md, description: "the full page for an arc", default: true }
      - { name: sketch, template: templates/arc.sketch.md, description: "a sketch: why it exists, what is still to decide, the beats; grow into full" }
    grouping:
      label: Campaigns
      property: campaign
      groups: [] # one entry per campaign run in this world, a name and a description, as they accrue
  - name: Files
    description: "Maps, handouts, reference art, and character sheets the pages link to."

# The property contract, one block per owner. A property applies to `all` collections or a list; a required
# one is generated into every new blueprint and surfaced when missing; `options` closes the value to a set.
properties:
  # The standard's. migrate rewrites this block; don't hand-edit it.
  core:
    - { name: id, type: Text, required: true, meaning: "Stable, unique identity, in any form. Assigned once, never changed." }
    - { name: title, type: Text, required: true, meaning: Human-readable name. }
    - { name: summary, type: Text, meaning: "One line: what this blueprint is. Feeds the index; absent, the index flags it." }
    - { name: variant, type: Text, meaning: Which variant this blueprint follows. Absent = the collection's default. }
  # Yours. The seed ships defaults; keep, scope, or drop any of them. Only the grouping is required.
  custom:
    - name: status
      type: Text
      applies_to: all
      options: [ Seed, Drafted, Canon, Retired ]
      meaning: "How settled this is: Seed is an idea, Drafted is written, Canon is true at the table, Retired is gone."
      eidosmd:
        canvas:
          show: true
          styles:
            Draft:
              color: "#8b9099"
            Intake:
              color: "#d3a53c"
            In Progress:
              color: "#5f80cf"
            Done:
              color: "#7fae6c"
            Archived:
              color: "#8b9099"
            Deprecated:
              color: "#cf7b8f"
            needs-clarification:
              color: "#5f80cf"
            maybe:
              color: "#e08a63"
            visionary:
              color: "#4aa39f"
    - { name: date_created, type: Date, applies_to: all, meaning: "YYYY-MM-DD. Set once." }
    - { name: date_modified, type: Date, applies_to: all, meaning: "YYYY-MM-DD. The last change." }
    - { name: tags, type: List, applies_to: all, meaning: "Free tags." }
    - { name: region, type: Text, required: true, applies_to: [ Places ], meaning: "Which region the place is in. Matches its sub-folder." }
    - { name: needs, type: List, applies_to: [ Places, Factions, Characters, Arcs ], meaning: "Pages this one needs in place to make sense, as links." }
    - { name: campaign, type: Text, applies_to: [ Arcs ], required: true, meaning: "Which campaign the arc belongs to. Matches its sub-folder." }
    - { name: revealed, type: Checkbox, applies_to: [ Places, Factions, Characters, Arcs ], meaning: Have the players met this yet? The Player role reads only what is revealed. }

# The root's own terms: term, means, not (the near-misses and why), and see (the blueprint that defines it).
# Starts empty; Eidos declares none.
vocabulary: []

# Generated by `eidos index`; never hand-edited. One list per collection, in the order the markdown index would use.
index:
  The World:
    - id: how-it-works
      title: How It Works
      summary: null
      path: How It Works.md
    - id: premise
      title: Premise
      summary: null
      path: Premise.md
    - id: the-table
      title: The Table
      summary: null
      path: The Table.md
    - id: tone
      title: Tone
      summary: null
      path: Tone.md
  Places: []
  Factions: []
  Characters: []
  Arcs: []
