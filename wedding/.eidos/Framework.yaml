# The framework document: the structure this project is written in. See EIDOS.md for what each key means;
# the `eidos` CLI edits this file. Every path is relative to this folder.

eidos_version: 5.14.0

# kebab-case | TitleCase | Title Case. Settled at install; changing it later means renaming files.
naming: Title Case

# Every file at the top of the project, one entry each.
top_level:
  - title: Start Here
    path: ../Start Here.md
    description: "where to start: what this is, and where things are"
  - title: The Timeline
    path: ../The Timeline.md
    description: the whole day on one page, hour by hour
  - title: Day-Of Contacts
    path: ../Day-Of Contacts.md
    description: every number the planner needs on the day, on one page

# Every folder at the top of the project, one entry each. `owned_by` names what governs it: "@eidos/collections" for
# blueprints, "@<tool>/<kind>" for a tool's own folder. Absent, the folder is yours and nothing reads it.
folders:
  # The framing docs: what every other blueprint is judged against. One left unwritten is a gap to surface,
  # not a failure.
  - name: The Big Picture
    owned_by: "@eidos/collections"
    description: "The big picture, four pages: what the day is for, who is coming, where it happens, and what it can cost. Every moment and vendor gets checked against these."
    variants:
      - { name: vision, template: templates/frame.vision.md, description: "what the day is for, how it should feel, and what it is not", default: true }
      - { name: guests, template: templates/frame.guests.md, description: "who is coming, and what different kinds of guests will need" }
      - { name: venue, template: templates/frame.venue.md, description: "the places, how guests move between them, and the house rules" }
      - { name: budget, template: templates/frame.budget.md, description: "the money, the date, what matters most, and the hard limits" }
  - name: Run of Show
    owned_by: "@eidos/collections"
    description: "One page per moment of the day, grouped by day and then by event, in the order it happens."
    variants:
      - { name: full, template: templates/moment.full.md, description: "the full plan for a moment", default: true }
      - { name: rough, template: templates/moment.rough.md, description: "a rough version: what it is for, what is still to decide, how it goes; grow into full" }
    label: Days and Events
    folder_property: day
    folders:
      - name: The Night Before
        description: "The rehearsal, the rehearsal dinner, the welcome drinks: everything before the wedding day itself."
      - name: Wedding Day
        description: The wedding day, one folder per event, in the order they happen.
        folders:
          - name: Getting Ready
            description: Hair, makeup, dressing, the first look, and the photos before the ceremony.
          - name: Ceremony
            description: "From guests arriving to the recessional: the processional, the vows, the rings, the kiss."
          - name: Cocktail Hour
            description: "The gap between the ceremony and the reception: drinks, the family photos, the room being turned."
          - name: Reception
            description: The entrances, dinner, the toasts, the first dance, the cake, the dancing, and the send-off.
      - name: The Morning After
        description: The farewell brunch, the gift opening, the last goodbyes.
      # a day or an event the plan needs and these lack is added as it comes up
  - name: Vendors
    owned_by: "@eidos/collections"
    description: "One page per vendor, grouped by category: what you are getting, when, and on what terms."
    variants:
      - { name: full, template: templates/vendor.full.md, description: "a booked vendor: what you are getting, their day, the deal" }
      - { name: quote, template: templates/vendor.quote.md, description: "a vendor you are considering: what they would do and what they quoted; grow into full when booked", default: true }
    label: Categories
    folder_property: category
    folders:
      - name: Venue
        description: "The places the day is held: ceremony site, reception venue, the rehearsal dinner spot."
      - name: Planning
        description: The planner or day-of coordinator.
      - name: Food and Drink
        description: Everything guests eat and drink, by who supplies it.
        folders:
          - name: Catering
            description: The meal, the service staff, and the tastings.
          - name: Cake and Desserts
            description: The cake, the dessert table, the late-night snack.
          - name: Bar
            description: The bar service and the bartenders, where the caterer does not cover it.
      - name: Photo and Video
        description: The photographer, the videographer, the photo booth.
      - name: Music
        description: Ceremony musicians, the band or DJ, and the sound.
      - name: Flowers and Decor
        description: The florist, the decor, and the lighting.
      - name: Attire and Beauty
        description: The outfits, the alterations, hair, and makeup.
      - name: Officiant
        description: Whoever marries the couple, and the paperwork that makes it legal.
      - name: Stationery
        description: Save-the-dates, invitations, programs, signs, and place cards.
      - name: Rentals
        description: Tables, chairs, linens, tableware, tents, and anything else hired for the day.
      - name: Transport
        description: Shuttles, cars, and the last ride home.
      # a category the vendors need and these lack is added as it comes up
  - name: Files
    owned_by: "@assets/files"
    description: "Contracts, floor plans, menus, playlists, and inspiration boards the pages link to; a set of files that belong together (a mood board, a signed contract with its riders) is one bundle."
  - name: Checklist
    owned_by: "@backlog/tasks"
    description: "The to-do list, one task per file, by how many months out it is due: the work that gets the day booked and ready, kept beside the pages it serves."

# The property contract, one block per owner. A property applies to `all` collections or a list; a required
# one is generated into every new blueprint and surfaced when missing; `options` closes the value to a set.
properties:
  # The standard's. migrate rewrites this block; don't hand-edit it.
  core:
    - { name: id, type: Text, required: true, meaning: "Stable, unique identity, in any form. Assigned once, never changed." }
    - { name: title, type: Text, required: true, meaning: Human-readable name. }
    - { name: summary, type: Text, meaning: "One line: what this blueprint is. Feeds the index; absent, the index flags it." }
    - { name: variant, type: Text, meaning: "Which variant this blueprint follows. Absent = the nearest default on its folder's path, else the collection's; `none` = no template." }
  # Yours. The seed ships defaults; keep, scope, or drop any of them.
  custom:
    - name: status
      type: Text
      applies_to: all
      options: [ Idea, Planned, Booked, Confirmed, Done, Cut ]
      meaning: "Where this stands: Idea, Planned, Booked, Confirmed, Done, or Cut."
      canvas:
        show: true
        styles:
          Idea:
            color: "#8b9099"
          Planned:
            color: "#d3a53c"
          Booked:
            color: "#5f80cf"
          Confirmed:
            color: "#4aa39f"
          Done:
            color: "#7fae6c"
          Cut:
            color: "#cf7b8f"
    - { name: date_created, type: Date, applies_to: all, meaning: "YYYY-MM-DD. Set once.", eidosmd: { new: today } }
    - { name: date_modified, type: Date, applies_to: all, meaning: "YYYY-MM-DD. The last change.", eidosmd: { new: today } }
    - { name: tags, type: List, applies_to: all, meaning: "Free tags." }
    - { name: day, type: Text, applies_to: [ Run of Show ], meaning: "Which day, and which event in it, this moment happens in: its folder's path, such as Wedding Day/Reception; a value that is not its folder warns." }
    - { name: needs, type: List, applies_to: [ Run of Show, Vendors ], meaning: "Moments or vendors that have to be in place first, as links." }
    - { name: category, type: Text, applies_to: [ Vendors ], meaning: "Which kind of vendor this is: its folder's path, such as Food and Drink/Catering; a value that is not its folder warns." }
    - { name: starts, type: Date & time, applies_to: [ Run of Show ], meaning: When it starts on the day. }
    - { name: duration, type: Number, applies_to: [ Run of Show ], meaning: "How long it runs, in minutes." }
    - { name: cost, type: Number, applies_to: [ Vendors ], meaning: "What they quoted, all in." }

# The project's own terms: term, means, not (the near-misses and why), and see (the blueprint that defines it).
# Starts empty; Eidos declares none.
vocabulary:
  - term: moment
    means: "One part of the day with a page of its own in the Run of Show: the first look, the vows, the toasts, the send-off."
    not:
      - "segment: the day is told in moments, one page each; a segment is the same thing under a second name"
  - term: event
    means: "A stretch of a day that holds its moments, and a folder in the Run of Show: getting ready, the ceremony, cocktail hour, the reception."
    not:
      - "block: a block of time is how a timeline reads it; in the Run of Show it is an event, a folder of moments"
  - term: decision
    means: "A call about the day, kept as a record where it belongs: open while it is still a question, Decided once the couple settles it, never deleted."
    not:
      - "resolution: say decision, so the Decisions list finds every one"
  - term: vendor
    means: Anyone paid to deliver part of the day, with a page in Vendors saying what they promised.
    not:
      - "supplier: the same thing under a second name; say vendor"

# Generated by `eidos index`; never hand-edited. One list per collection, in the order the markdown index would use.
index:
  The Big Picture:
    - id: budget
      title: Budget
      summary: null
      path: Budget.md
    - id: guests
      title: Guests
      summary: null
      path: Guests.md
    - id: venue
      title: Venue
      summary: null
      path: Venue.md
    - id: vision
      title: Vision
      summary: null
      path: Vision.md
  Run of Show: []
  Vendors: []
