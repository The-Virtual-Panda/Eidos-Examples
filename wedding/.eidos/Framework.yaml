# The framework document: the structure this root is written in. See EIDOS.md for what each key means;
# the `eidos` CLI edits this file. Every path is relative to this folder.

eidos_version: 5.4.0

# kebab-case | TitleCase | Title Case. Settled at install; changing it later means renaming files.
naming: Title Case

# Every file at the root, one entry each.
top_level:
  - title: Start Here
    path: ../Start Here.md
    description: "where to start: what this is, and where things are"
  - title: The Timeline
    path: ../The Timeline.md
    description: the whole day on one page, hour by hour
  - title: Day-Of Contacts
    path: ../Day-Of Contacts.md
    description: every number the planner needs on the day, on one page

# Every folder at the root, one entry each. `owned_by` names what governs it: "@eidos/collections" for
# blueprints, "@<tool>/<kind>" for a tool's own folder. Absent, the folder is yours and nothing reads it.
folders:
  # The framing docs: what every other blueprint is judged against. One left unwritten is a gap to surface,
  # not a failure.
  - name: The Big Picture
    owned_by: "@eidos/collections"
    description: "The big picture, four pages: what the day is for, who is coming, where it happens, and what it can cost. Every moment and vendor gets checked against these."
    variants:
      - { name: vision, template: templates/frame.vision.md, description: "what the day is for, how it should feel, and what it is not", default: true }
      - { name: guests, template: templates/frame.guests.md, description: "who is coming, and what different kinds of guests will need" }
      - { name: venue, template: templates/frame.venue.md, description: "the places, how guests move between them, and the house rules" }
      - { name: budget, template: templates/frame.budget.md, description: "the money, the date, what matters most, and the hard limits" }
  - name: Run of Show
    owned_by: "@eidos/collections"
    description: "One page per moment of the day, grouped by day, in the order it happens."
    variants:
      - { name: full, template: templates/moment.full.md, description: "the full plan for a moment", default: true }
      - { name: rough, template: templates/moment.rough.md, description: "a rough version: what it is for, what is still to decide, how it goes; grow into full" }
    grouping:
      label: Days
      property: day
      groups: [] # one entry per day (the rehearsal, the wedding day, the morning after), a name and a description, as they accrue
  - name: Vendors
    owned_by: "@eidos/collections"
    description: "One page per vendor, grouped by category: what you are getting, when, and on what terms."
    variants:
      - { name: full, template: templates/vendor.full.md, description: "a booked vendor: what you are getting, their day, the deal", default: true }
      - { name: quote, template: templates/vendor.quote.md, description: "a vendor you are considering: what they would do and what they quoted; grow into full when booked" }
    grouping:
      label: Categories
      property: category
      groups: [] # one entry per category (venue, catering, photo, music, flowers, attire), a name and a description, as they accrue
  - name: Files
    description: "Contracts, floor plans, playlists, and photos the pages link to."

# The property contract, one block per owner. A property applies to `all` collections or a list; a required
# one is generated into every new blueprint and surfaced when missing; `options` closes the value to a set.
properties:
  # The standard's. migrate rewrites this block; don't hand-edit it.
  core:
    - { name: id, type: Text, required: true, meaning: "Stable, unique identity, in any form. Assigned once, never changed." }
    - { name: title, type: Text, required: true, meaning: Human-readable name. }
    - { name: summary, type: Text, meaning: "One line: what this blueprint is. Feeds the index; absent, the index flags it." }
    - { name: variant, type: Text, meaning: Which variant this blueprint follows. Absent = the collection's default. }
  # Yours. The seed ships defaults; keep, scope, or drop any of them. Only the grouping is required.
  custom:
    - name: status
      type: Text
      applies_to: all
      options: [ Idea, Planned, Booked, Confirmed, Done, Cut ]
      meaning: "Where this stands: Idea, Planned, Booked, Confirmed, Done, or Cut."
      eidosmd:
        canvas:
          show: true
          styles:
            Draft:
              color: "#8b9099"
            Intake:
              color: "#d3a53c"
            In Progress:
              color: "#5f80cf"
            Done:
              color: "#7fae6c"
            Archived:
              color: "#8b9099"
            Deprecated:
              color: "#cf7b8f"
            needs-clarification:
              color: "#5f80cf"
            maybe:
              color: "#e08a63"
            visionary:
              color: "#4aa39f"
    - { name: date_created, type: Date, applies_to: all, meaning: "YYYY-MM-DD. Set once." }
    - { name: date_modified, type: Date, applies_to: all, meaning: "YYYY-MM-DD. The last change." }
    - { name: tags, type: List, applies_to: all, meaning: "Free tags." }
    - { name: day, type: Text, required: true, applies_to: [ Run of Show ], meaning: "Which day this moment happens on. Matches its sub-folder." }
    - { name: needs, type: List, applies_to: [ Run of Show, Vendors ], meaning: "Moments or vendors that have to be in place first, as links." }
    - { name: category, type: Text, applies_to: [ Vendors ], required: true, meaning: "Which kind of vendor (catering, photo, music). Matches the sub-folder." }
    - { name: starts, type: Date & time, applies_to: [ Run of Show ], meaning: When it starts on the day. }
    - { name: duration, type: Number, applies_to: [ Run of Show ], meaning: "How long it runs, in minutes." }
    - { name: cost, type: Number, applies_to: [ Vendors ], meaning: "What they quoted, all in." }

# The root's own terms: term, means, not (the near-misses and why), and see (the blueprint that defines it).
# Starts empty; Eidos declares none.
vocabulary: []

# Generated by `eidos index`; never hand-edited. One list per collection, in the order the markdown index would use.
index:
  The Big Picture:
    - id: budget
      title: Budget
      summary: null
      path: Budget.md
    - id: guests
      title: Guests
      summary: null
      path: Guests.md
    - id: venue
      title: Venue
      summary: null
      path: Venue.md
    - id: vision
      title: Vision
      summary: null
      path: Vision.md
  Run of Show: []
  Vendors: []
